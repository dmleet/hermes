[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beets-hermes"
version = "0.10.10"
description = "beets plugin exposing an HTTP agent that runs `beet import` jobs for Hermes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["beets>=2.0"]

[project.scripts]
hermes-agent = "beetsplug.hermes:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["beetsplug"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
