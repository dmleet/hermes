# Development stack (docs/plan.md A12). Run `scripts/dev-init.sh` once, then `docker compose up`.
#
#   beets    beets-hermes image, agent on :8338, library in dev/beets/ (starts empty; seed
#            known albums with `docker compose exec beets beets-python /scripts/seed-dev-library.py`)
#   deluge   one instance, web UI on :8112 (password "deluge"), Label plugin enabled
#   prowlarr on :9696 with a per-checkout API key generated by scripts/dev-init.sh and the
#            PandaCD public indexer (Creative Commons music) added by scripts/dev-prowlarr-setup.py
#   hermes   from source with reload on :8000
#
# Production Prowlarr is not used here; the only grab target is the compose Deluge. All
# ports bind to loopback so the stack (and any private indexer you add) is not on the LAN.
# Set HERMES_DRY_RUN=false in .env to let Hermes actually grab from PandaCD.
#
# Volume layout mirrors production: Deluge sees the whole download share at /downloads
# (pending/, complete/, torrents/) while beets sees only complete/ at /downloads.

services:
  beets:
    build:
      context: .
      dockerfile: deploy/beets/Dockerfile
    image: beets-hermes:dev
    entrypoint: ["hermes-agent", "--host", "0.0.0.0", "--port", "8338"]
    user: "1000:1000"
    environment:
      BEETSDIR: /config
      TZ: America/New_York
    volumes:
      - ./dev/beets:/config
      - ./dev/music:/music
      - ./dev/downloads/complete:/downloads
      - ./scripts:/scripts:ro
    ports:
      - "127.0.0.1:8338:8338"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8338/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  deluge:
    image: lscr.io/linuxserver/deluge:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
      DELUGE_LOGLEVEL: info
    volumes:
      - ./dev/deluge/config:/config
      - ./dev/downloads:/downloads
    ports:
      - "127.0.0.1:8112:8112"
      # No UDP publish: on Docker Desktop a published UDP port swallows the replies to
      # libtorrent's tracker announces sent from that same port ("tracker status: timed
      # out" on every torrent, seen 2026-09-07). Nothing inbound needs it: the publish is
      # loopback-only and private torrents use no DHT.
      - "127.0.0.1:6881:6881"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.3.5.5327-ls147   # same tag as the cluster
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
    volumes:
      - ./dev/prowlarr/config:/config
    ports:
      - "127.0.0.1:9696:9696"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:9696/ping"]
      interval: 15s
      timeout: 5s
      retries: 10

  hermes:
    build: .
    image: hermes:dev
    command: ["hermes", "serve", "--reload"]
    env_file:
      - path: .env
        required: false
    environment:
      HERMES_CONFIG_PATH: /config/config.yaml
      HERMES_DATA_DIR: /data
      DELUGE_PASSWORD: ${DELUGE_PASSWORD:-deluge}
      # In-network addresses override whatever .env says (which targets the host CLI).
      PROWLARR_URL: http://prowlarr:9696
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:?run scripts/dev-init.sh}
      HERMES_DRY_RUN: ${HERMES_DRY_RUN:-true}
    volumes:
      - ./hermes:/app/hermes
      - ./dev/hermes:/config:ro
      - ./dev/data:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      beets:
        condition: service_healthy
      deluge:
        condition: service_started
      prowlarr:
        condition: service_healthy
