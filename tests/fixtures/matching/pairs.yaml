# The matching corpus: a target as MusicBrainz names it against a listing as a tracker
# titles it, and the verdict the matcher must reach (tests/unit/test_matching_pairs.py).
#
# Rows marked with an acquisition number are real: the target is what the request
# resolved to, the listing a row Prowlarr returned, the verdict what a human confirmed by
# approving or importing. Invented rows use "Artist" and "Album" and stand for one
# mechanism each. Titles are public tracker metadata; no row names a tracker or an account.
#
# Fields: artist, title, year (the target); listing (the tracker's title); expect
# (accept | reject, against policy.quality.match_threshold); why (the mechanism, for the
# reader); queries (optional: the Prowlarr queries the search tries, in order); gap
# (optional: a verdict the matcher does not reach yet, kept as an expected failure so a
# fix turns it green and a regression is loud); query_gap (the same, for the queries). The corpus judges matching alone: a
# listing ranking would still drop for its type, format or media is a matching verdict
# here all the same.

# --- real acquisitions -------------------------------------------------------------

- artist: CAN
  title: "Anthology: 25 Years"
  year: 1994
  listing: "Can - Anthology (1994) [Anthology] [Remaster 2007] [FLAC Lossless / CD / Log (100%) / Cue]"
  expect: accept
  why: "#74: the listing drops the subtitle; the head query is what finds it"
  queries: ["CAN Anthology 25 Years", "CAN Anthology", "CAN"]

